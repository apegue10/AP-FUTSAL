
name: Publicar AP FUTSAL para iPhone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar carpetas
        run: |
          pwd
          ls -la
          ls -la iphone

      - name: Preparar archivos de iPhone
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./iphone

      - name: Publicar web
        uses: actions/deploy-pages@v4
